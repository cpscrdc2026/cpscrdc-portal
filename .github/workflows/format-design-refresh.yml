name: Format design refresh
on:
  push:
    branches:
      - design/club-identity-editorial-refresh
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/club-identity-editorial-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --write index.html assets/css/portal.css
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/css/portal.css
          git commit -m "Format editorial design files" || exit 0
          git push origin HEAD:design/club-identity-editorial-refresh
